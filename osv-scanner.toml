# Findings accepted for a limited time. Each entry names one advisory, why it does not
# apply to this program, and the date by which it must be revisited.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
ignoreUntil = 2027-01-31T00:00:00Z
reason = """crypto-bigint 0.5.5 reaches this program only through ssh-key 0.6 -> p256/p384, \
where the server verifies SSH login signatures against registered public keys \
(src/ssh_login.rs). Verification works on public data only; signing happens on the \
user's own machine, so there is no secret integer whose timing could leak. The fix \
(crypto-bigint 0.7.6) needs ssh-key 0.7, which is still a pre-release. Revisit when \
ssh-key 0.7 is released."""

[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2027-01-31T00:00:00Z
reason = """block-buffer 0.10.4 reaches this program only through digest 0.10, pulled in by \
ssh-key 0.6.7 (sha2 0.10, p256/p384, ecdsa through rfc6979 and hmac 0.12) and the direct \
dependency ed25519-dalek 2.2.0 (sha2 0.10, curve25519-dalek). Both serve SSH login: key \
fingerprints and signature verification in src/ssh_login.rs. The program's own sha2 0.11 \
and hmac 0.13 already use the fixed block-buffer 0.12.1. The flaw needs a panic inside a \
hash compression callback that the caller catches and then keeps using the same buffer. \
Neither the program nor these crates catch panics, tokio drops a task's future once it \
panics, and the SHA-2 compression functions do not branch on input. The fix needs \
ssh-key 0.7, still a pre-release. Revisit when a stable ssh-key no longer pulls in \
digest 0.10."""
