name: CI
# Changes selects checks from ci/checks.tsv; gate verifies both executed and
# skipped jobs. Keep the public event matrix and publication jobs independent
# of the private workflow split.
# Each content is tested once, on its pull request. A push to main only keeps
# the caches warm (cache-* jobs); tags and manual runs run the full suite.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OSV_SCANNER_VERSION: "v2.7.1"
  NODE_VERSION: "26.13.1"
  BUILDX_VERSION: "v0.37.2"
  BUILDKIT_IMAGE: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

jobs:
  changes:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    # Every other job and the gate follow this one, so a push to main skips
    # the whole suite here.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      guards: ${{ steps.switches.outputs.guards }}
      controls: ${{ steps.switches.outputs.controls }}
      web: ${{ steps.switches.outputs.web }}
      compose: ${{ steps.switches.outputs.compose }}
      rust: ${{ steps.switches.outputs.rust }}
      e2e: ${{ steps.switches.outputs.e2e }}
      image: ${{ steps.switches.outputs.image }}
      build_kit: ${{ steps.switches.outputs.build_kit }}
      osv: ${{ steps.switches.outputs.osv }}
      leak: ${{ steps.switches.outputs.leak }}
      scope: ${{ steps.switches.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only pull requests need history for base-to-head routing.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false
      - name: compute the switches
        id: switches
        env:
          CHANGES_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGES_HEAD: ${{ github.event.pull_request.head.sha }}
          CHANGES_SCOPE: ${{ env.CHANGES_SCOPE }}
        run: bash ci/changes.sh

  guards:
    timeout-minutes: 6
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - name: guards checks
        run: bash ci/job/guards.sh

  controls:
    timeout-minutes: 6
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.controls == 'true'
    permissions:
      contents: read
    env:
      CHANGES_BASE: ${{ github.event.pull_request.base.sha }}
      CHANGES_HEAD: ${{ github.event.pull_request.head.sha }}
      CHANGES_SCOPE: ${{ needs.changes.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - name: controls checks
        run: bash ci/job/controls.sh

  web:
    timeout-minutes: 6
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - name: web checks
        run: bash ci/job/web.sh

  compose:
    timeout-minutes: 6
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: compose checks
        run: bash ci/job/compose.sh

  rust:
    timeout-minutes: 20
    # Every Rust check keeps its own command and minimum-toolchain policy.
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install Rust check components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-download-resilience >/dev/null
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: identify the Rust compiler
        id: compiler
        run: echo "fingerprint=$(rustc -vV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: restore Cargo registry and targets
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-rust-${{ steps.compiler.outputs.fingerprint }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'Dockerfile') }}
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test (unit + fake-host integration + gpu-table example)
        run: cargo test --locked
      - name: test host locks across Linux processes
        run: |
          cargo test --locked --test lock_process --no-run --message-format=json > "${RUNNER_TEMP}/lock-process-build.json"
          test_binary="$(jq -er -s '
            [.[] | select(.reason == "compiler-artifact" and .target.name == "lock_process" and .profile.test)
             | .executable | select(. != null)] | unique
            | if length == 1 then .[0] else error("expected one lock_process executable") end
          ' "${RUNNER_TEMP}/lock-process-build.json")"
          # Cargo writes target as the runner user; only the Linux lock probes need root.
          sudo -- "$test_binary" --ignored --test-threads=1 --nocapture
      # Pull requests check all targets plus the musl target; full runs keep
      # the complete build and the musl release build.
      - name: compile with the declared minimum Rust
        run: bash ci/min-rust.sh ${{ github.event_name == 'pull_request' && 'check' || 'build' }}

  e2e-build:
    timeout-minutes: 20
    # Build the release fake host server once; every e2e shard downloads it.
    # Release mode keeps the argon2id paths within the 7 s expect budget.
    # The artifact name is fixed for the run: rerunning failed shards reads the
    # build of the attempt they rerun from, and a full rerun uploads a new one.
    # Three days of retention cover rerunning a shard after a weekend.
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: identify the Rust compiler
        id: compiler
        run: echo "fingerprint=$(rustc -vV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: restore Cargo registry and targets
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-e2e-${{ steps.compiler.outputs.fingerprint }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'Dockerfile') }}
      - name: build the fake host server (release)
        run: bash ci/job/e2e.sh server
      - name: upload the fake host server
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-fake-host
          path: target/release/examples/fake_host_server
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  e2e:
    timeout-minutes: 20
    # The browser suite, split into Playwright shards that each start the
    # prebuilt fake host. A failed build skips every shard, which the gate
    # rejects because the e2e switch is on.
    runs-on: ubuntu-latest
    needs: [changes, e2e-build]
    if: needs.changes.outputs.e2e == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      E2E_SHARD: ${{ matrix.shard }}
      E2E_SHARD_TOTAL: "3"
      NVM_E2E_SERVER_BIN: target/release/examples/fake_host_server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: download the fake host server
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-fake-host
          path: target/release/examples
      - name: restore npm downloads
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ env.NODE_VERSION }}-${{ hashFiles('web/package-lock.json') }}
      - name: build web/dist
        run: bash ci/job/e2e.sh web
      - name: restore Playwright browsers
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-chromium-${{ hashFiles('web/package-lock.json') }}
      - name: install chromium and system dependencies
        run: bash ci/job/e2e.sh browsers
      # The hosted runner provides /dev/shm; verify tmpfs and capacity before
      # creating isolated state. The server and browser run on this host.
      - name: per-run e2e state
        run: bash ci/job/e2e.sh state
      - name: playwright shard
        run: bash ci/job/e2e.sh run "$E2E_SHARD" "$E2E_SHARD_TOTAL"
      - name: upload failure traces and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            web/test-results/
            ${{ env.NVM_E2E_SERVER_LOG }}
          if-no-files-found: warn
          retention-days: 14

  image:
    timeout-minutes: 25
    # Build the image, assert its filesystem and run the container tests in
    # one job on one daemon — the image ID is shared directly, with no
    # artifact round trip. Every image run exports the filesystem for checks;
    # tag runs upload the tested archive and SBOM for the release job.
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
    env:
      NVM_CI_WORK: /tmp/nvm-ci-container-work
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      BUILDX_METADATA_PROVENANCE: "max"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: build the final image once
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          tags: nvm-ci:candidate
          push: false
          load: true
          provenance: false
          pull: true
          cache-from: type=gha,scope=image-amd64-${{ hashFiles('Dockerfile', 'Cargo.toml', 'Cargo.lock', 'web/package-lock.json') }}
      - name: retain the native build record
        env:
          BUILT_IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          # The runner writes this script to disk before starting the shell.
          # Normalized JSON cannot close the quoted heredoc or execute shell text.
          cat > nvm-build-metadata.json <<'NVM_BUILD_METADATA_JSON'
          ${{ toJSON(fromJSON(steps.build.outputs.metadata)) }}
          NVM_BUILD_METADATA_JSON
          image_id="$(docker image inspect -f '{{.Id}}' nvm-ci:candidate)"
          test "$image_id" = "$BUILT_IMAGE_ID"
          printf '%s\n' "$image_id" > nvm-image.id
      - name: export the image with its id
        run: |
          set -euo pipefail
          image_id="$(cat nvm-image.id)"
          docker image inspect "${image_id}" >/dev/null
          docker save "${image_id}" -o nvm-image.tar
          echo "image: $(wc -c < nvm-image.tar | tr -d ' ') bytes in the docker save archive (sha256 $(sha256sum nvm-image.tar | awk '{print $1}'))"
      - name: the release accepts this artifact
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: GHCR_IMAGE="ghcr.io/${RELEASE_REPOSITORY,,}" python3 .github/scripts/ghcr_release.py artifact
      - name: the image filesystem holds only the listed files
        run: python3 ci/image-assert.py nvm-image.tar
      - name: log predicate controls
        run: bash ci/container/log-object-check-test.sh
      - name: cleanup machinery controls
        run: bash ci/cleanup-lib-test.sh
      - name: container-level tests
        run: |
          # Reuse the curl-equipped Rust build image, including its pinned digest.
          NVM_CURL_IMAGE="$(awk '
            $1 == "FROM" && $3 == "AS" && $4 == "rust" {
              count++; image = $2; if (NF != 4) exit 1
            }
            END { if (count != 1) exit 1; print image }
          ' Dockerfile)" || { echo "expected exactly one Rust stage in Dockerfile" >&2; exit 1; }
          [[ "${NVM_CURL_IMAGE}" =~ ^rust:1-bookworm@sha256:[a-f0-9]{64}$ ]] \
            || { echo "Dockerfile Rust image must be a complete tag@sha256 digest" >&2; exit 1; }
          export NVM_CURL_IMAGE
          docker pull "${NVM_CURL_IMAGE}"
          NVM_IMAGE="$(cat nvm-image.id)" bash ci/container/test.sh
      - name: record the tested image
        id: tested-image
        run: echo "id=$(cat nvm-image.id)" >> "$GITHUB_OUTPUT"
      - name: generate the tested image SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.tested-image.outputs.id }}
          format: spdx-json
          output-file: nvm-image.spdx.json
          syft-version: v1.27.1
          upload-artifact: false
          upload-release-assets: false
      - name: upload the image for the release job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nvm-image
          path: |
            nvm-image.tar
            nvm-image.id
            nvm-image.spdx.json
            nvm-build-metadata.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
          compression-level: 1
      - name: upload retained test evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-evidence-attempt-${{ github.run_attempt }}
          path: /tmp/nvm-ci-container-work/
          if-no-files-found: error
          retention-days: 14

  build-script:
    timeout-minutes: 20
    # The build script tests run inside the pinned build environment: the
    # official Debian image pinned by its index digest plus the manifest
    # packages.
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.build_kit == 'true'
    permissions:
      contents: read
    env:
      NVM_CI_WORK: /tmp/nvm-ci-build-script-work
      NVM_BUILD_KIT: /tmp/nvm-ci-build-kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fake input generator controls
        run: bash ci/build-script/make-fake-run-test.sh
      - name: prepare the pinned build environment
        run: bash ci/build-script/prepare-env.sh
      - name: the generator reproduces the manifest
        run: bash tools/build-kit.sh check
      - name: build script tests
        run: bash ci/build-script/test.sh
      - name: upload retained test evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-script-evidence-attempt-${{ github.run_attempt }}
          path: /tmp/nvm-ci-build-script-work/
          if-no-files-found: error
          retention-days: 14

  osv:
    timeout-minutes: 6
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.osv == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: osv checks
        run: bash ci/job/osv.sh

  # Push to main: pull requests restore caches only from their own ref or the
  # default branch, so main saves them. Each job restores with the exact key
  # its pull request job uses and does real work only when that key is missing.
  cache-rust:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      CARGO_INCREMENTAL: "0"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install Rust check components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: identify the Rust compiler
        id: compiler
        run: echo "fingerprint=$(rustc -vV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: restore Cargo registry and targets
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-rust-${{ steps.compiler.outputs.fingerprint }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'Dockerfile') }}
      - name: build the cached targets
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --no-run
          bash ci/min-rust.sh check
      - name: save Cargo registry and targets
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  cache-e2e:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      CARGO_INCREMENTAL: "0"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: identify the Rust compiler
        id: compiler
        run: echo "fingerprint=$(rustc -vV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: restore Cargo registry and targets
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-e2e-${{ steps.compiler.outputs.fingerprint }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'Dockerfile') }}
      - name: restore Playwright browsers
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-chromium-${{ hashFiles('web/package-lock.json') }}
      - name: build the fake host server (release)
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: bash ci/job/e2e.sh server
      - name: download chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: |
          npm ci
          npx playwright install chromium
      - name: save Cargo registry and targets
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: save Playwright browsers
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}

  # A warm build is quick and re-exports any evicted layers under the scope
  # the pull request image job reads.
  cache-image:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: export the image layer cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          provenance: false
          pull: true
          cache-from: type=gha,scope=image-amd64-${{ hashFiles('Dockerfile', 'Cargo.toml', 'Cargo.lock', 'web/package-lock.json') }}
          cache-to: type=gha,mode=max,scope=image-amd64-${{ hashFiles('Dockerfile', 'Cargo.toml', 'Cargo.lock', 'web/package-lock.json') }}
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"

  gate:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    needs: [changes, guards, controls, web, compose, rust, e2e, image, build-script, osv, public-leak]
    if: always() && (github.event_name != 'push' || github.ref != 'refs/heads/main')
    permissions:
      contents: read
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      GUARDS_RESULT: ${{ needs.guards.result }}
      CONTROLS_RESULT: ${{ needs.controls.result }}
      SWITCH_CONTROLS: ${{ needs.changes.outputs.controls }}
      WEB_RESULT: ${{ needs.web.result }}
      SWITCH_WEB: ${{ needs.changes.outputs.web }}
      COMPOSE_RESULT: ${{ needs.compose.result }}
      SWITCH_COMPOSE: ${{ needs.changes.outputs.compose }}
      RUST_RESULT: ${{ needs.rust.result }}
      SWITCH_RUST: ${{ needs.changes.outputs.rust }}
      E2E_RESULT: ${{ needs.e2e.result }}
      SWITCH_E2E: ${{ needs.changes.outputs.e2e }}
      IMAGE_RESULT: ${{ needs.image.result }}
      SWITCH_IMAGE: ${{ needs.changes.outputs.image }}
      BUILD_SCRIPT_RESULT: ${{ needs.build-script.result }}
      SWITCH_BUILD_KIT: ${{ needs.changes.outputs.build_kit }}
      OSV_RESULT: ${{ needs.osv.result }}
      SWITCH_OSV: ${{ needs.changes.outputs.osv }}
      LEAK_RESULT: ${{ needs.public-leak.result }}
      SWITCH_LEAK: ${{ needs.changes.outputs.leak }}
      GATE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      GATE_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: read the live pull request base
        if: github.event_name == 'pull_request'
        run: |
          git check-ref-format "refs/heads/${GATE_BASE_BRANCH}"
          git fetch --no-tags origin "refs/heads/${GATE_BASE_BRANCH}"
          printf 'GATE_BASE_SHA=%s\n' "$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
      - name: judge the run
        run: bash ci/gate.sh

  public-leak:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.leak == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: public scan controls
        run: |
          bash ci/install-gitleaks-test.sh
          bash ci/github-ci-test.sh
      - name: install checksum-pinned secret scanner
        run: bash ci/install-gitleaks.sh "${RUNNER_TEMP}/public-leak-tools"
      - name: scan the tracked commit for secrets
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d "${RUNNER_TEMP}/public-scan.XXXXXXXX")"
          trap 'rm -rf -- "${work}"' EXIT
          git archive --format=tar HEAD | tar -xf - -C "${work}"
          PATH="${RUNNER_TEMP}/public-leak-tools:${PATH}" gitleaks dir "${work}" --config .gitleaks.toml --redact=100 --no-banner --exit-code 1

  release:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: gate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: ghcr-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      pull-requests: read
    env:
      GHCR_ATTESTATION_MODE: ${{ (!github.event.repository.private || vars.PRIVATE_ATTESTATIONS_ENABLED == 'true') && 'github' || 'build-record' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: set the repository image name
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: printf 'GHCR_IMAGE=ghcr.io/%s\n' "${RELEASE_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: validate the release tag
        run: python3 .github/scripts/ghcr_release.py validate
      - name: require a merged main pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_release_pr.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nvm-image
      - name: log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: publish the tested image and read back its digest
        id: published
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ghcr_release.py publish
      - name: attest build provenance
        if: env.GHCR_ATTESTATION_MODE == 'github'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: attest the tested image SBOM
        if: env.GHCR_ATTESTATION_MODE == 'github'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.published.outputs.digest }}
          sbom-path: nvm-image.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: promote the highest stable version and read back
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_DIGEST: ${{ steps.published.outputs.digest }}
        run: python3 .github/scripts/ghcr_release.py promote
      - name: retain the SBOM and publication receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghcr-receipt-attempt-${{ github.run_attempt }}
          path: |
            nvm-image.spdx.json
            nvm-build-metadata.json
            ghcr-receipt.json
          if-no-files-found: warn
          retention-days: 14
      - name: log out of GHCR
        if: always()
        run: docker logout ghcr.io
